<div class="forgot-page">

  <div class="forgot-card">

    <div class="icon-box">
      <i class="bi bi-shield-lock"></i>
    </div>

    <h2>Forgot Password?</h2>

    <p class="subtitle">
      No worries! Enter your registered details and we'll help you reset your password.
    </p>

    <form (ngSubmit)="sendResetRequest()">

      <div class="form-group">
        <label>Username</label>

        <div class="input-box">
          <i class="bi bi-person"></i>

          <input
            type="text"
            class="form-control"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter your username"
            required>
        </div>
      </div>

      <div class="form-group">
        <label>Contact Number</label>

        <div class="input-box">
          <i class="bi bi-phone"></i>

          <input
            type="tel"
            class="form-control"
            name="contactNumber"
            [(ngModel)]="contactNumber"
            placeholder="Enter registered contact number"
            maxlength="10"
            required>
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary reset-btn">
        Send Reset Request
      </button>

    </form>

    <div class="back-login">
      <a routerLink="/login">
        <i class="bi bi-arrow-left"></i>
        Back to Sign In
      </a>
    </div>

    <div class="security-note">
      <i class="bi bi-shield-check"></i>
      Your account information is protected and secure.
    </div>

  </div>

</div>
