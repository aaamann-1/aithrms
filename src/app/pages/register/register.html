<div class="register-page">

  <!-- RIGHT SIDE -->
  <div class="register-right">

<div class="register-card">

  <h2>Create Account</h2>

  <p class="subtitle">
    Register to continue
  </p>


  <!-- ROLE -->

  <div class="role-selection">

    <label class="role-option">

      <input
        type="radio"
        name="role"
        value="admin"
        [(ngModel)]="selectedRole">

      <span>Admin</span>

    </label>


    <label class="role-option">

      <input
        type="radio"
        name="role"
        value="staff"
        [(ngModel)]="selectedRole">

      <span>Staff</span>

    </label>

  </div>


  <!-- FULL NAME -->

  <div class="input-group-custom">

  <i class="bi bi-person"></i>

  <input
    type="text"
    placeholder="Full Name"
    [(ngModel)]="fullName">

</div>

<div
  class="validation-message"
  *ngIf="submitted && !fullName">
  Full Name is required.
</div>


  <!-- USERNAME -->

  <div class="input-group-custom">

  <i class="bi bi-person-badge"></i>

  <input
    type="text"
    placeholder="Username"
    [(ngModel)]="username">

</div>

<div
  class="validation-message"
  *ngIf="submitted && !username">
  Username is required.
</div>


  <!-- CONTACT -->
<div class="input-group-custom">

  <i class="bi bi-telephone"></i>

  <input
    type="tel"
    maxlength="10"
    placeholder="Contact Number"
    [(ngModel)]="contactNumber">

</div>

<div
  class="validation-message"
  *ngIf="submitted && contactNumber.length !== 10">

  Contact Number must contain exactly 10 digits.

</div>


  <!-- PASSWORD -->

 <div class="input-group-custom">

  <i class="bi bi-lock"></i>

  <input
    [type]="showPassword ? 'text' : 'password'"
    placeholder="Password"
    [(ngModel)]="password">

  <button
    type="button"
    class="password-toggle"
    (click)="showPassword = !showPassword">

    <i
      class="bi"
      [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'">
    </i>

  </button>

</div>

<div
  class="validation-message"
  *ngIf="submitted && password.length < 6">

  Password must be at least 6 characters.

</div>

  <!-- CONFIRM PASSWORD -->

 <div class="input-group-custom">

  <i class="bi bi-lock-fill"></i>

  <input
    [type]="showConfirmPassword ? 'text' : 'password'"
    placeholder="Confirm Password"
    [(ngModel)]="confirmPassword">

  <button
    type="button"
    class="password-toggle"
    (click)="showConfirmPassword = !showConfirmPassword">

    <i
      class="bi"
      [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'">
    </i>

  </button>

</div>

<div
  class="validation-message"
  *ngIf="submitted && confirmPassword && password !== confirmPassword">

  Passwords do not match.

</div>

  <!-- REGISTER BUTTON -->

  <button
    type="button"
    class="create-btn"
    (click)="register()">

    Create Account

  </button>


  <!-- DIVIDER -->

  <div class="divider">

    <span>OR</span>

  </div>


  <!-- LOGIN LINK -->

  <p class="login-link">

    Already have an account?

    <a routerLink="/login">
      Sign In
    </a>

  </p>

</div>
  </div>

</div>
