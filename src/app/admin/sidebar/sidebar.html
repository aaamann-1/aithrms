<aside class="sidebar" [class.collapsed]="collapsed()">

  <!-- ================= LOGO ================= -->

  <div class="logo-section">

    <div class="logo-icon">
      ♢

    <div class="logo-text">
      <strong>DSR Web Panel<br></strong>
      <span>Billing Support</span>
    </div>

  </div>


  <!-- ================= NAVIGATION TITLE ================= -->

  <div class="navigation-title">
    NAVIGATION
  </div>


  <!-- ================= NAVIGATION ================= -->

  <nav class="navigation">

    <!-- DASHBOARD -->

    <button
      type="button"
      class="nav-item"
      routerLink="/admin/dashboard"
      routerLinkActive="active"
    >

      <span class="nav-icon">
        ▦
      </span>

      <span>
        Dashboard
      </span>

    </button>


    <!-- LIVE ACTIVITY FEED -->

    <button
      type="button"
      class="nav-item"
      routerLink="/admin/live-feed"

        〽
      </span>

      <span>
        Live Activity Feed
      </span>

    </button>


    <!-- STAFF MANAGEMENT -->

    <button
      type="button"
      class="nav-item"
      routerLink="/admin/staff-management"
      routerLinkActive="active"

      <span class="nav-icon">

      </span>

      <span>
        Staff Management
      </span>

    </button>


    <!-- ATTENDANCE -->

    <button
      type="button"
      class="nav-item"
      routerLink="/admin/attendance"
      routerLinkActive="active"

      <span class="nav-icon">
        ◷
      </span>

      <span>
        Attendance
      </span>

    </button>

    <button
      type="button"
      class="nav-item"
      routerLink="/admin/reports/individual"
      routerLinkActive="active"
    >

      <span class="nav-icon">
        ▣
      </span>

      <span>
        Individual Reports
      </span>

    </button>


    <!-- TEAM REPORTS -->

    <button
      type="button"
      class="nav-item"
      routerLink="/admin/reports/team"
      routerLinkActive="active"

      </span>

        Team Reports
      </span>

    </button>

    <button
      type="button"
      class="nav-item"
      routerLink="/admin/export-reports"
      routerLinkActive="active"

      <span class="nav-icon">

      <span>
        Export Reports
      </span>

    </button>


    <!-- ISSUE CATEGORIES -->

    <button
      type="button"
      class="nav-item"
      routerLink="/admin/issue-categories"
      routerLinkActive="active"
    >

      <span class="nav-icon">
        ◇
      </span>

      <span>
        Issue Categories
      </span>

    </button>


    <!-- SETTINGS -->

    <button
      type="button"
      class="nav-item"
      routerLink="/admin/settings"
      routerLinkActive="active"
    >

      <span class="nav-icon">
        ⚙
      </span>

      <span>
        Settings
      </span>

    </button>

  </nav>


  <!-- ================= LOGOUT ================= -->

  <div class="sidebar-bottom">

    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >

      <span>
        ⇥
      </span>

      <span class="nav-label">
        Logout
      </span>

    </button>

  </div>

</aside>
