<!-- ================= PAGE CONTENT ================= -->
<main class="page-content">

  <!-- Page Header -->
  <div class="page-header">

    <div>
      <h1>Staff Management</h1>
      <p>Manage your support team</p>
    </div>

    <button
      class="add-staff-btn"
      routerLink="/admin/employee"
    >
      + Add Staff
    </button>

  </div>


  <!-- ================= STAFF GRID ================= -->
  <div class="staff-grid">

    <div
      class="staff-card"
      *ngFor="let staff of filteredStaff"
    >

      <!-- ================= CARD TOP ================= -->
      <div class="card-top">

        <div
          class="staff-avatar"
          [ngClass]="staff.avatarClass"
        >
          {{ staff.initials }}

          <span
            class="status-dot"
            [ngClass]="staff.statusClass"
          ></span>
        </div>

        <span
          class="status-badge"
          [ngClass]="staff.badgeClass"
        >
          {{ staff.status }}
        </span>

      </div>


      <!-- ================= STAFF INFO ================= -->

      <div class="staff-info">

        <h3>
          {{ staff.name }}
        </h3>

        <p>
          {{ staff.role }}
        </p>

      </div>


      <!-- ================= DIVIDER ================= -->

      <div class="card-divider"></div>


      <!-- ================= STAFF STATS ================= -->

      <div class="staff-stats">

        <!-- In Progress -->
        <div>
          <strong>
            {{ staff.inProgress }}
          </strong>

          <span>
            In Progress
          </span>
        </div>


        <!-- Resolved -->
        <div>
          <strong>
            {{ staff.resolved }}
          </strong>

          <span>
            Resolved
          </span>
        </div>


        <!-- Pending -->
        <div>
          <strong>
            {{ staff.pending }}
          </strong>

          <span>
            Pending
          </span>
        </div>

      </div>

    </div>

  </div>


  <!-- ================= NO RESULTS ================= -->

  <div
    class="no-results"
    *ngIf="filteredStaff.length === 0"
  >

    <h3>
      No staff found
    </h3>

    <p>
      No staff member matches
      "{{ searchQuery }}".
    </p>

  </div>

</main>
