
  <!-- ================= PAGE CONTENT ================= -->
    <main class="page-content">

      <!-- Page Header -->
      <div class="page-header">

        <div>
          <h1>Staff Management</h1>
          <p>Manage your support team</p>
        </div>

        <button class="add-staff-btn" routerLink="/admin/employee">
  + Add Staff
</button>

      </div>

      <!-- ================= STAFF GRID ================= -->
      <div class="staff-grid">

  <div
    class="staff-card"
    *ngFor="let staff of filteredStaff"
  >

    <div class="card-top">

      <div
        class="staff-avatar"
        [ngClass]="staff.avatarClass"
      >
        {{ staff.initials }}

        <span
          class="status-dot"
          [ngClass]="staff.statusClass"
        ></span>
      </div>

      <span
        class="status-badge"
        [ngClass]="staff.badgeClass"
      >
        {{ staff.status }}
      </span>

    </div>

    <div class="staff-info">
      <h3>{{ staff.name }}</h3>
      <p>{{ staff.role }}</p>
    </div>

    <div class="card-divider"></div>

    <div class="staff-stats">

      <div>
        <strong>{{ staff.tickets }}</strong>
        <span>Tickets</span>
      </div>

      <div>
        <strong>{{ staff.resolved }}</strong>
        <span>Resolved</span>
      </div>

      <div>
        <strong>{{ staff.pending }}</strong>
        <span>Pending</span>
      </div>

    </div>

  </div>

</div>
<div
  class="no-results"
  *ngIf="filteredStaff.length === 0"
>
  <h3>No staff found</h3>
  <p>No staff member matches "{{ searchQuery }}".</p>
</div>
