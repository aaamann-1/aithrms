<div class="employee-form-page">

  <!-- ================= HEADER ================= -->

  <div class="form-page-header">

    <button
  type="button"
  class="back-btn"
  (click)="goBack()">
  ← Back to Employees
</button>

    <div>
      <h1>Add Employee</h1>
      <p>Enter employee personal and contact information</p>
    </div>

  </div>


  <!-- ================= FORM CARD ================= -->

  <div class="form-card">


    <!-- PERSONAL -->

    <div class="section-header">
      <h2>Personal</h2>
    </div>


    <div class="form-grid">


      <!-- Employee Name -->

      <div class="form-group employee-name-field">

        <label>
          Employee Name <span>*</span>
        </label>

        <div class="name-wrapper">

          <select
            [(ngModel)]="employeeForm.title">

            <option value="Mr.">Mr.</option>
            <option value="Mrs.">Mrs.</option>
            <option value="Ms.">Ms.</option>

          </select>

          <input
            type="text"
            [(ngModel)]="employeeForm.employeeName"
            placeholder="Enter Name As Per Aadhaar">

        </div>

      </div>


      <!-- Father Name -->

      <div class="form-group">

        <label>Father Name</label>

        <input
          type="text"
          [(ngModel)]="employeeForm.fatherName"
          placeholder="Enter Father Name">

      </div>


      <!-- Mother Name -->

      <div class="form-group">

        <label>Mother Name</label>

        <input
          type="text"
          [(ngModel)]="employeeForm.motherName"
          placeholder="Enter Mother Name">

      </div>


      <!-- Gender -->

      <div class="form-group">

        <label>
          Gender <span>*</span>
        </label>

        <select [(ngModel)]="employeeForm.gender">

          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>

        </select>

      </div>


      <!-- Date of Birth -->

      <div class="form-group">

        <label>Date of Birth</label>

        <input
          type="text"
          [(ngModel)]="employeeForm.dateOfBirth"
          placeholder="DD-MM-YYYY">

      </div>


      <!-- Blood Group -->

      <div class="form-group">

        <label>Blood Group</label>

        <select [(ngModel)]="employeeForm.bloodGroup">

          <option value="">Select Blood Group</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>

        </select>

      </div>


      <!-- Mobile -->

      <div class="form-group">

        <label>
          Mobile No. <span>*</span>
        </label>

        <input
          type="tel"
          [(ngModel)]="employeeForm.mobileNumber"
          placeholder="Enter Mobile Number">

      </div>


      <!-- Email -->

      <div class="form-group">

        <label>
          Personal Email ID <span>*</span>
        </label>

        <input
          type="email"
          [(ngModel)]="employeeForm.personalEmail"
          placeholder="Enter Personal Email ID">

      </div>


      <!-- Nationality -->

      <div class="form-group">

        <label>Nationality</label>

        <input
          type="text"
          [(ngModel)]="employeeForm.nationality"
          placeholder="Nationality">

      </div>


      <!-- Marital Status -->

      <div class="form-group">

        <label>Marital Status</label>

        <select [(ngModel)]="employeeForm.maritalStatus">

          <option value="Single">Single</option>
          <option value="Married">Married</option>
          <option value="Divorced">Divorced</option>
          <option value="Widowed">Widowed</option>

        </select>

      </div>


      <!-- Spouse -->

      <div class="form-group">

        <label>Spouse Name</label>

        <input
          type="text"
          [(ngModel)]="employeeForm.spouseName"
          placeholder="Enter Spouse Name">

      </div>


      <!-- Aadhaar -->

      <div class="form-group">

        <label>Aadhaar Number</label>

        <input
          type="text"
          [(ngModel)]="employeeForm.aadhaarNumber"
          placeholder="Enter Aadhaar Number">

      </div>


      <!-- PAN -->

      <div class="form-group">

        <label>PAN No.</label>

        <input
          type="text"
          [(ngModel)]="employeeForm.panNumber"
          placeholder="Enter PAN No.">

      </div>


      <!-- Religion -->

      <div class="form-group">

        <label>Religion</label>

        <select [(ngModel)]="employeeForm.religion">

          <option value="Hindu">Hindu</option>
          <option value="Muslim">Muslim</option>
          <option value="Christian">Christian</option>
          <option value="Sikh">Sikh</option>
          <option value="Buddhist">Buddhist</option>
          <option value="Jain">Jain</option>
          <option value="Other">Other</option>

        </select>

      </div>

    </div>

    <div class="form-group">

  <label>
    Designation <span>*</span>
  </label>

  <select
    [(ngModel)]="employeeForm.designation">

    <option value="">
      Select Designation
    </option>

    <option value="Support Executive">
      Support Executive
    </option>

    <option value="Senior Support Executive">
      Senior Support Executive
    </option>

    <option value="Team Leader">
      Team Leader
    </option>

    <option value="HR Executive">
      HR Executive
    </option>

    <option value="Manager">
      Manager
    </option>

    <option value="Admin">
      Admin
    </option>

  </select>

</div>


    <!-- ================= ADDRESS ================= -->

    <div class="section-divider"></div>


    <div class="address-container">


      <!-- CURRENT ADDRESS -->

      <!-- ================= CURRENT & PERMANENT ADDRESS ================= -->

<div class="form-section">
  <div class="section-header">
    <h2>Current Address</h2>
    <p>Enter the employee's current residential address</p>
  </div>

  <div class="address-grid">

    <div class="form-group">
      <label>Address Line 1</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.currentAddress1"
        placeholder="Enter address line 1"
      />
    </div>

    <div class="form-group">
      <label>Address Line 2</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.currentAddress2"
        placeholder="Enter address line 2"
      />
    </div>

    <div class="form-group">
      <label>Address Line 3</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.currentAddress3"
        placeholder="Enter address line 3"
      />
    </div>

    <div class="form-group">
      <label>Country</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.currentCountry"
        placeholder="Enter country"
      />
    </div>

    <div class="form-group">
      <label>State</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.currentState"
        placeholder="Enter state"
      />
    </div>

    <div class="form-group">
      <label>City</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.currentCity"
        placeholder="Enter city"
      />
    </div>

    <div class="form-group">
      <label>Pincode</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.currentPincode"
        placeholder="Enter pincode"
      />
    </div>

  </div>
</div>


<!-- ================= PERMANENT ADDRESS ================= -->

<div class="form-section">
  <div class="section-header">
    <h2>Permanent Address</h2>
    <p>Enter the employee's permanent residential address</p>
  </div>

  <div class="same-address">
    <label>
      <input
        type="checkbox"
        (change)="copyCurrentAddress()"
      />
      Same as Current Address
    </label>
  </div>

  <div class="address-grid">

    <div class="form-group">
      <label>Address Line 1</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.permanentAddress1"
        placeholder="Enter address line 1"
      />
    </div>

    <div class="form-group">
      <label>Address Line 2</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.permanentAddress2"
        placeholder="Enter address line 2"
      />
    </div>

    <div class="form-group">
      <label>Address Line 3</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.permanentAddress3"
        placeholder="Enter address line 3"
      />
    </div>

    <div class="form-group">
      <label>Country</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.permanentCountry"
        placeholder="Enter country"
      />
    </div>

    <div class="form-group">
      <label>State</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.permanentState"
        placeholder="Enter state"
      />
    </div>

    <div class="form-group">
      <label>City</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.permanentCity"
        placeholder="Enter city"
      />
    </div>

    <div class="form-group">
      <label>Pincode</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.permanentPincode"
        placeholder="Enter pincode"
      />
    </div>

  </div>
</div>


<!-- ================= EMERGENCY CONTACT ================= -->

<div class="form-section">
  <div class="section-header">
    <h2>Emergency Contact</h2>
    <p>Provide an emergency contact person for the employee</p>
  </div>

  <div class="emergency-grid">

    <div class="form-group">
      <label>Contact Person</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.emergencyContact"
        placeholder="Enter contact person"
      />
    </div>

    <div class="form-group">
      <label>Relation</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.emergencyRelation"
        placeholder="Enter relation"
      />
    </div>

    <div class="form-group">
      <label>Mobile No.</label>
      <input
        type="text"
        [(ngModel)]="employeeForm.emergencyMobile"
        placeholder="Enter mobile number"
      />
    </div>

  </div>
</div>

<!-- ================= FORM ACTIONS ================= -->

<div class="form-footer">
  <button
    type="button"
    class="cancel-btn"
    (click)="goBack()">
    Cancel
  </button>

  <button
    type="button"
    class="save-btn"
    (click)="saveEmployee()">
    {{ isEditMode ? 'Update Employee' : 'Save Employee' }}
  </button>
</div>
