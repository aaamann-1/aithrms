
    <section class="page-content">
      <div class="page-heading">
        <div>
          <h1>Issue Categories</h1>
          <p>Manage support issue classifications</p>
        </div>

        <button class="add-category-button" type="button" (click)="addCategory()">
          <span>＋</span>
          Add Category
        </button>
      </div>

      <section class="categories-grid">
        <article
          class="category-card"
          *ngFor="let category of filteredCategories"
        >
          <div class="category-card-top">
            <div
              class="category-icon"
              [style.color]="category.color"
              [style.background]="category.background"
            >
              ◇
            </div>

            <div class="card-actions">
              <button type="button" (click)="editCategory(category)">♢</button>
              <button type="button" (click)="deleteCategory(category)">♧</button>
            </div>
          </div>

          <h2>{{ category.name }}</h2>
          <p>{{ category.description }}</p>

          <div class="category-total">
            <span>Total Issues</span>
            <strong [style.color]="category.color">{{ category.total }}</strong>
          </div>
        </article>
      </section>

      <section class="analytics-card">
        <div class="analytics-header">
          <h2>Category Analytics</h2>
          <p>Issue distribution by category</p>
        </div>

        <div class="chart">
          <div class="chart-y-axis">
            <span>60</span>
            <span>45</span>
            <span>30</span>
            <span>15</span>
            <span>0</span>
          </div>

          <div class="chart-area">
            <div class="grid-line line-1"></div>
            <div class="grid-line line-2"></div>
            <div class="grid-line line-3"></div>
            <div class="grid-line line-4"></div>
            <div class="grid-line line-5"></div>

            <div class="bars">
              <div class="bar-column" *ngFor="let category of categories">
                <div
                  class="bar"
                  [style.height]="getBarHeight(category.total)"
                  [style.background]="category.color"
                ></div>

                <span>{{ category.shortName }}</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </section>
