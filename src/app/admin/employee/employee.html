<div class="employee-page">

  <!-- Page Header -->
  <div class="page-header">

    <div>
      <h1>Employees</h1>
      <p>Manage employees and their account details</p>
    </div>

    <button
      class="new-employee-btn"
      type="button"
      (click)="openForm()">

      <span>+</span>
      New Employee

    </button>

  </div>


  <!-- Employee List -->
  <div class="employee-card">

    <div class="card-header">

      <div>
        <h2>Employee List</h2>
      </div>

      <span>
        {{ employees.length }} Employees
      </span>

    </div>


    <div class="employee-table">

      <!-- Table Header -->
      <div class="table-header">
        <div>Name</div>
        <div>Email</div>
        <div>Status</div>
      </div>


      <!-- Employee Rows -->
      <div
        class="table-row"
        *ngFor="let employee of employees">

        <div class="employee-name">

          <div class="avatar">
            {{ employee.name.charAt(0) }}
          </div>

          <span>
            {{ employee.name }}
          </span>

        </div>


        <div class="employee-email">
          {{ employee.email }}
        </div>


        <div>
          <span class="status active">
            Active
          </span>
        </div>

      </div>

    </div>

  </div>

</div>
