<header class="staff-navbar">

  <!-- MENU -->
  <button
    type="button"
    class="menu-button"
    (click)="toggleMenu()">

    ☰

  </button>


  <!-- SEARCH -->
  <div class="search-box">

    <span class="search-icon">
      🔍
    </span>

    <input
      type="text"
      [(ngModel)]="searchQuery"
      placeholder="Search tasks, reports...">

  </div>


  <!-- DATE -->
  <div class="date-section">

    <input
      type="date"
      [(ngModel)]="selectedDate"
      class="date-picker">

  </div>


  <!-- NOTIFICATION -->
  <div class="notification-wrapper">

    <button
      type="button"
      class="notification-button"
      (click)="toggleNotifications()">

      🔔

      <span class="notification-count">
        3
      </span>

    </button>


    <div
      class="notification-dropdown"
      *ngIf="showNotifications">

      <div class="dropdown-title">
        Notifications
      </div>

      <div class="notification-item">
        <strong>Task Update</strong>
        <span>2 tasks are pending.</span>
      </div>

      <div class="notification-item">
        <strong>Report Update</strong>
        <span>Today's report is ready.</span>
      </div>

      <div class="notification-item">
        <strong>Support Alert</strong>
        <span>1 issue needs attention.</span>
      </div>

    </div>

  </div>


  <!-- SEPARATOR -->
  <div class="profile-separator"></div>


  <!-- PROFILE -->
  <div class="profile-wrapper">

    <button
      type="button"
      class="profile-button"
      (click)="toggleProfile()">

      <div class="profile-avatar">
        {{ avatarInitial }}
      </div>

      <div class="profile-info">

        <strong>
          {{ fullName }}
        </strong>

        <span>
          {{ designation }}
        </span>

      </div>

      <span class="profile-arrow">
        ▾
      </span>

    </button>


    <!-- PROFILE DROPDOWN -->
    <div
      class="profile-dropdown"
      *ngIf="showProfile">

      <div class="profile-dropdown-header">

        <strong>
          {{ fullName }}
        </strong>

        <span>
          {{ designation }}
        </span>

      </div>


      <!-- ONLY SETTINGS -->
      <button
        type="button"
        (click)="openSettings()">

        Settings

      </button>

    </div>

  </div>

</header>
